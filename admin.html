<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetCraft - Panel de Administración</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .admin-header {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .admin-header h1 {
      color: var(--primary-cyan);
      margin: 0;
    }
    
    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .admin-tab {
      padding: 10px 20px;
      background: var(--card-bg);
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    
    .admin-tab.active {
      background: var(--primary-cyan);
      color: #000;
    }
    
    .admin-section {
      display: none;
    }
    
    .admin-section.active {
      display: block;
    }
    
    .product-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
    }
    
    .product-table th, .product-table td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    
    .product-table th {
      background: #0d1117;
      color: var(--primary-cyan);
    }
    
    .product-table tr:hover {
      background: rgba(0, 188, 212, 0.1);
    }
    
    .btn-action {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 5px;
    }
    
    .btn-edit {
      background: var(--primary-cyan);
      color: #000;
    }
    
    .btn-delete {
      background: #e74c3c;
      color: white;
    }
    
    .add-product-form {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    
    .add-product-form input, .add-product-form select {
      padding: 10px;
      background: #0d1117;
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 5px;
    }
    
    .add-product-form button {
      grid-column: span 2;
      padding: 12px;
      background: var(--primary-cyan);
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      color: #000;
    }
    
    .claim-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      border-left: 4px solid var(--primary-cyan);
    }
    
    .claim-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    
    .claim-code {
      color: var(--primary-cyan);
      font-weight: bold;
    }
    
    .claim-status {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
    }
    
    .claim-status.pendiente {
      background: #f39c12;
      color: #000;
    }
    
    .claim-status.atendido {
      background: #27ae60;
      color: white;
    }
    
    .claim-details {
      color: #ccc;
      font-size: 14px;
    }
    
    .claim-details p {
      margin: 5px 0;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <h1><i class="fas fa-cog"></i> Panel de Administración NetCraft</h1>
      <a href="index.html" style="color: var(--primary-cyan); text-decoration: none;">
        <i class="fas fa-arrow-left"></i> Volver a la tienda
      </a>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" onclick="showTab('productos')">
        <i class="fas fa-box"></i> Productos
      </button>
      <button class="admin-tab" onclick="showTab('agregar')">
        <i class="fas fa-plus"></i> Agregar Producto
      </button>
      <button class="admin-tab" onclick="showTab('reclamaciones')">
        <i class="fas fa-exclamation-circle"></i> Reclamaciones
      </button>
    </div>

    <!-- Sección: Lista de Productos -->
    <div id="productos" class="admin-section active">
      <h2 style="color: white; margin-bottom: 15px;">Administrar Productos</h2>
      <table class="product-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Marca</th>
            <th>Categoría</th>
            <th>Top</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="products-table-body">
          <!-- Productos se cargan aquí -->
        </tbody>
      </table>
    </div>

    <!-- Sección: Agregar Producto -->
    <div id="agregar" class="admin-section">
      <h2 style="color: white; margin-bottom: 15px;">Agregar Nuevo Producto</h2>
      <form class="add-product-form" onsubmit="agregarProducto(event)">
        <input type="text" id="new-nombre" placeholder="Nombre del producto" required>
        <input type="number" id="new-precio" placeholder="Precio (S/.)" step="0.01" required>
        <input type="text" id="new-imagen" placeholder="Ruta de imagen (ej: img/p1.png)" required>
        <select id="new-marca" required>
          <option value="">Seleccionar Marca</option>
          <option value="asus">ASUS</option>
          <option value="lenovo">Lenovo</option>
          <option value="hp">HP</option>
          <option value="acer">Acer</option>
          <option value="msi">MSI</option>
          <option value="gigabyte">Gigabyte</option>
          <option value="kingston">Kingston</option>
          <option value="logitech">Logitech</option>
        </select>
        <select id="new-categoria" required>
          <option value="">Seleccionar Categoría</option>
          <option value="procesadores">Procesadores</option>
          <option value="tarjetas-de-video">Tarjetas de Video</option>
          <option value="laptops">Laptops</option>
          <option value="perifericos">Periféricos</option>
          <option value="almacenamiento">Almacenamiento</option>
          <option value="monitores">Monitores</option>
        </select>
        <label style="color: white; display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="new-top"> Producto Top
        </label>
        <button type="submit">Agregar Producto</button>
      </form>
    </div>

    <!-- Sección: Reclamaciones -->
    <div id="reclamaciones" class="admin-section">
      <h2 style="color: white; margin-bottom: 15px;">Libro de Reclamaciones</h2>
      <div id="claims-container">
        <!-- Reclamaciones se cargan aquí -->
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api';

    // Cargar productos al iniciar
    document.addEventListener('DOMContentLoaded', () => {
      cargarProductos();
      cargarReclamaciones();
    });

    function showTab(tabId) {
      document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // --- PRODUCTOS ---
    async function cargarProductos() {
      try {
        const response = await fetch(`${API_URL}/productos`);
        const productos = await response.json();
        
        const tbody = document.getElementById('products-table-body');
        tbody.innerHTML = productos.map(p => `
          <tr>
            <td>${p.id}</td>
            <td>${p.nombre}</td>
            <td>S/. ${p.precio.toFixed(2)}</td>
            <td>${p.marca.toUpperCase()}</td>
            <td>${p.categoria}</td>
            <td>${p.top ? '⭐ Sí' : 'No'}</td>
            <td>
              <button class="btn-action btn-delete" onclick="eliminarProducto(${p.id})">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        `).join('');
      } catch (error) {
        console.error('Error cargando productos:', error);
      }
    }

    async function agregarProducto(e) {
      e.preventDefault();
      
      const nuevoProducto = {
        nombre: document.getElementById('new-nombre').value,
        precio: parseFloat(document.getElementById('new-precio').value),
        imagen: document.getElementById('new-imagen').value,
        marca: document.getElementById('new-marca').value,
        categoria: document.getElementById('new-categoria').value,
        top: document.getElementById('new-top').checked
      };

      try {
        const response = await fetch(`${API_URL}/productos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(nuevoProducto)
        });
        
        if (response.ok) {
          alert('Producto agregado exitosamente!');
          cargarProductos();
          e.target.reset();
        }
      } catch (error) {
        alert('Error al agregar producto');
        console.error(error);
      }
    }

    async function eliminarProducto(id) {
      if (!confirm('¿Estás seguro de eliminar este producto?')) return;
      
      try {
        const response = await fetch(`${API_URL}/productos/${id}`, { method: 'DELETE' });
        if (response.ok) {
          alert('Producto eliminado');
          cargarProductos();
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    // --- RECLAMACIONES ---
    async function cargarReclamaciones() {
      try {
        const response = await fetch(`${API_URL}/reclamaciones`);
        const reclamaciones = await response.json();
        
        const container = document.getElementById('claims-container');
        
        if (reclamaciones.length === 0) {
          container.innerHTML = '<p style="color: #ccc; text-align: center;">No hay reclamaciones aún</p>';
          return;
        }
        
        container.innerHTML = reclamaciones.map(r => `
          <div class="claim-card">
            <div class="claim-header">
              <span class="claim-code">${r.codigo}</span>
              <span class="claim-status ${r.estado}">${r.estado}</span>
            </div>
            <div class="claim-details">
              <p><strong>Cliente:</strong> ${r.nombre} (${r.dni})</p>
              <p><strong>Tipo:</strong> ${r.tipo_incidencia}</p>
              <p><strong>Producto:</strong> ${r.tipo_bien} - S/. ${r.monto_producto || 'N/A'}</p>
              <p><strong>Descripción:</strong> ${r.descripcion}</p>
              <p><strong>Pedido:</strong> ${r.pedido}</p>
              <p><small style="color: #666;">Fecha: ${new Date(r.fecha).toLocaleString()}</small></p>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error cargando reclamaciones:', error);
      }
    }
  </script>
</body>
</html>
