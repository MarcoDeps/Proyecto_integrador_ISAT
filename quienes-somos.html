<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netcraft | Quiénes Somos</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .seccion-nosotros {
      padding: 50px 5%;
      background-color: #ffffff;
    }

    .flex-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      max-width: 1200px;
      margin: 0 auto;
      gap: 30px;
    }

    .texto {
      flex: 1 1 400px;
    }

    .texto h1 {
      color: #2c3e50;
      font-size: 2.5rem;
    }

    .texto p {
      line-height: 1.8;
      font-size: 1.1rem;
      color: #333;
    }

    .imagen {
      flex: 1 1 400px;
      text-align: center;
    }

    .imagen img {
      max-width: 100%;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      .texto {
        text-align: center;
        order: 2;
      }
      .imagen {
        order: 1;
      }
      .texto h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

  <div id="header-placeholder"></div>

  <section class="seccion-nosotros">
    <div class="flex-container">
      <div class="texto">
        <h1>Sobre Nosotros</h1>
        <p>Somos una empresa peruana y nos dedicamos a ofrecer las mejores soluciones tecnológicas con un enfoque humano y creativo para nuestros clientes.</p>
        <p>Nuestra meta es simplificar tu vida a través de herramientas innovadoras y un soporte excepcional que nos distingue en el mercado.</p>
      </div>
      <div class="imagen">
        <img src="img/tienda_logo.png" alt="Nuestro equipo trabajando">
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <div id="chatbot-placeholder"></div>

  <script src="header.js"></script>
  <script src="footer.js"></script>
  <script src="chatbot.js"></script>
  <script src="script.js"></script>
</body>

</html>
