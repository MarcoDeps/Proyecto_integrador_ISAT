<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro de Reclamaciones | NetCraft</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-cyan: #00bcd4;
            --dark-bg: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        /* Barra de Navegación / Botón Regreso */
        .nav-reclamaciones {
            background-color: var(--card-bg);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .btn-volver {
            color: var(--primary-cyan);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            transition: 0.3s;
            border: 1px solid var(--primary-cyan);
            padding: 8px 15px;
            border-radius: 5px;
        }

        .btn-volver:hover {
            background-color: var(--primary-cyan);
            color: #000;
        }

        .reclamaciones-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 40px;
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Detalles Identificación Empresa */
        .info-empresa {
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-cyan);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .form-header h2 {
            color: var(--primary-cyan);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #8b949e;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        input:focus { border-color: var(--primary-cyan); outline: none; }

        .form-section {
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
            margin-top: 25px;
        }

        .form-section h3 {
            font-size: 1rem;
            margin-bottom: 20px;
            color: var(--primary-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-enviar {
            background: var(--primary-cyan);
            color: #000;
            border: none;
            padding: 18px;
            width: 100%;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-enviar:hover {
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.5);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .grid-inputs { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="nav-reclamaciones">
        <div class="logo">
            <span style="color: var(--primary-cyan); font-weight: bold; font-size: 1.2rem;">NETCRAFT</span>
        </div>
        <a href="index.html" class="btn-volver">
            <i class="fas fa-arrow-left"></i> VOLVER A LA TIENDA
        </a>
    </nav>

    <main class="reclamaciones-container">
        <div class="form-header">
            <h2>Libro de Reclamaciones</h2>
            <p id="fecha-actual" style="color: #8b949e; font-size: 0.9rem;"></p>
        </div>

        <div class="info-empresa">
            <strong>NETCRAFT E.I.R.L.</strong><br>
            RUC: 2045268569 <br>
            Dirección: Calle Principal 123, Surco - Lima.
        </div>

        <form id="complaintForm" onsubmit="enviarFormulario(event)">
            <div class="form-section">
                <h3><i class="fas fa-user"></i> 1. Identificación del Consumidor</h3>
                <div class="grid-inputs">
                    <div class="input-group">
                        <label>Nombre y Apellidos</label>
                        <input type="text" required placeholder="Juan Perez">
                    </div>
                    <div class="input-group">
                        <label>DNI / CE</label>
                        <input type="text" required placeholder="8 dígitos">
                    </div>
                </div>
                <div class="grid-inputs">
                    <div class="input-group">
                        <label>Correo Electrónico</label>
                        <input type="email" required placeholder="tu@correo.com">
                    </div>
                    <div class="input-group">
                        <label>Teléfono / WhatsApp</label>
                        <input type="tel" required placeholder="999 999 999">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3><i class="fas fa-shopping-cart"></i> 2. Detalle del Bien Contratado</h3>
                <div class="grid-inputs">
                    <div class="input-group">
                        <label>Tipo de Bien</label>
                        <select>
                            <option>Producto (Hardware, periféricos, etc.)</option>
                            <option>Servicio (Mantenimiento, armado, etc.)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Monto del Producto (S/)</label>
                        <input type="number" step="0.01" placeholder="0.00">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3><i class="fas fa-exclamation-circle"></i> 3. Detalle de la Reclamación</h3>
                <div class="input-group">
                    <label>Tipo (Queja o Reclamo)</label>
                    <select id="tipo_incidencia">
                        <option value="Reclamo">Reclamo (Disconformidad con el producto)</option>
                        <option value="Queja">Queja (Disconformidad con la atención)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Descripción detallada</label>
                    <textarea rows="4" required></textarea>
                </div>
                <div class="input-group">
                    <label>Pedido del Consumidor (¿Qué solución buscas?)</label>
                    <textarea rows="3" required></textarea>
                </div>
            </div>

            <button type="submit" class="btn-enviar">REGISTRAR MI HOJA DE RECLAMACIÓN</button>
        </form>
    </main>

    <script>
        const API_URL = '/api';
        
        // Mostrar fecha automática
        const hoy = new Date();
        document.getElementById('fecha-actual').innerText = "Fecha: " + hoy.toLocaleDateString();

        async function enviarFormulario(event) {
            event.preventDefault();
            
            const form = event.target;
            const formData = new FormData(form);
            
            const reclamacion = {
                nombre: formData.get('nombre'),
                dni: formData.get('dni'),
                correo: formData.get('correo'),
                telefono: formData.get('telefono'),
                tipo_bien: formData.querySelector('select').value,
                monto_producto: formData.get('monto') || '0',
                tipo_incidencia: document.getElementById('tipo_incidencia').value,
                descripcion: formData.querySelector('textarea:nth-of-type(1)').value,
                pedido: formData.querySelector('textarea:nth-of-type(2)').value
            };

            try {
                // Intentar enviar a la API
                const response = await fetch(`${API_URL}/reclamaciones`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reclamacion)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert("✅ ¡Reclamación Registrada!\n\nTu número de seguimiento es: " + data.codigo + "\nTe enviaremos una respuesta en un plazo máximo de 15 días hábiles.");
                    window.location.href = "index.html";
                } else {
                    throw new Error('Error del servidor');
                }
            } catch (error) {
                // Fallback: guardar localmente y mostrar código simulado
                console.log('API no disponible, guardando localmente');
                const nroReclamo = Math.floor(Math.random() * 9000) + 1000;
                localStorage.setItem('reclamacion_' + nroReclamo, JSON.stringify(reclamacion));
                alert("✅ ¡Reclamación Registrada!\n\nTu número de seguimiento es: NET-2026-" + nroReclamo + "\n(Modo offline - se guardará localmente)\nTe enviaremos una respuesta en un plazo máximo de 15 días hábiles.");
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
